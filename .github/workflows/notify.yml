name: Trello Discord Notifier

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (UTC), adjust if you want less frequent checks
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab

permissions:
  contents: write            # needed so the workflow can commit state.json back

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync
        env:
          UV_PYTHON: "3.11"

      - name: Run notifier
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_BOARD_ID: ${{ secrets.TRELLO_BOARD_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TZ_NAME: "Asia/Manila"
        run: uv run trello_discord_notifier.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "Update notification state [skip ci]"
          git push
