name: Trello Discord Notifier

on:
  # Schedule disabled: this project runs on Railway now (see README's
  # "Real-time on Railway" section). Re-enable the schedule below if you
  # ever move back to polling instead of webhooks.
  # schedule:
  #   - cron: "*/5 * * * *"   # every 5 minutes (UTC)
  workflow_dispatch: {}       # manual trigger only, for testing

permissions:
  contents: write            # needed so the workflow can commit state.json back

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync
        env:
          UV_PYTHON: "3.11"

      - name: Run notifier
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_BOARD_ID: ${{ secrets.TRELLO_BOARD_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MEMBER_MAP: ${{ secrets.DISCORD_MEMBER_MAP }}
          TZ_NAME: "Asia/Manila"
        run: uv run trello_discord_notifier.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "Update notification state [skip ci]"
          git push
